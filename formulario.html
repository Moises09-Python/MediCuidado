<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta</title>
    <link rel="stylesheet" href="css/formestilos.css">
        <center>
        <div class="navbar">
            <ul>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="info.html">Informacion General</a></li>
                <li><a href="formulario.html">Agendar Cita</a></li>
            </ul>
        </div><br>
        </center>
</head>
<body>
    <center>
        <h1>Agenda tu cita</h1><br><br>
            <form id="Encuesta">
                <label for="nombre">Nombre</label><br>
                <input type="text" id="nombre"><br>
                <label for="pr1">Edad</label><br>
                <input type="number" id="pr1"><br>
                <label for="pr2" type="radio">Sexo</label><br>
                    <input type="radio" id="si" name="pr2">Hombre<br>
                    <input type="radio" id="no" name="pr2">Mujer<br>
                <label for="pr3">No. Celular</label><br>
                <input type="text" id="pr3"><br>
                <label for="pr4">Selecciona Dia</label><br>
                <select id="pr4">
                    <option value="">Seleccione</option>
                    <option value="l">Lunes</option>
                    <option value="ma">Martes</option>
                    <option value="mi">Miercoles</option>
                    <option value="j">Jueves</option>
                    <option value="v">Viernes</option>
                    <option value="s">Sabado</option>
                </select><br>
                <label for="pr5">Selecciona tu hora</label><br>
                <select id="pr5">
                    <option value="">Seleccione</option>
                    /*9 10 11 12 1, 4 5 6*/
                    <option value="1">9:00 AM</option>
                    <option value="2">9:30 AM</option>
                    <option value="3">10:00 AM</option>
                    <option value="4">10:30 AM</option>
                    <option value="5">11:00 AM</option>
                    <option value="6">11:30 AM</option>
                    <option value="7">12:00 PM</option>
                    <option value="8">12:30 PM</option>
                    <option value="9">1:00 PM</option>
                    <option value="10">1:30 PM</option>
                    <option value="11">4:00 PM</option>
                    <option value="12">4:30 PM</option>
                    <option value="13">5:00 PM</option>
                    <option value="14">5:30 PM</option>
                    <option value="15">6:00 PM</option>
                    <option value="16">6:30 PM</option>
                </select><br>
                <input type="submit" id="envi"><br>
            </form>
    </center>
</body>
</html>
